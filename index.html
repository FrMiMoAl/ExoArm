<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExoArm – Proyecto Final</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
  </script>

  <style>
    body{
      margin:0;
      background:#050505;
      color:white;
      font-family:Segoe UI, Roboto, sans-serif;
    }

    /* ===== HERO ===== */
    .hero{
      position:relative;
      height:100vh;
      overflow:hidden;
      display:flex;
      align-items:flex-end;
    }

    .hero video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-2;
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.45);
      z-index:-1;
    }

    .hero-content{
      padding:60px;
      max-width:600px;
    }

    .hero h1{
      font-size:3.5rem;
      margin:0;
      text-transform:uppercase;
      letter-spacing:-2px;
    }

    .hero h1 span{
      color:#d90429;
    }

    .hero p{
      font-size:1.2rem;
      color:#ddd;
      margin:20px 0 30px;
    }

    .hero a{
      display:inline-block;
      padding:15px 45px;
      background:#d90429;
      color:white;
      text-decoration:none;
      border-radius:40px;
      font-weight:bold;
    }

    .hero a:hover{
      background:#ef233c;
    }

    /* ===== PIEZAS ===== */
    section{
      max-width:1200px;
      margin:80px auto;
      padding:0 20px;
    }

    h2{
      border-left:4px solid #d90429;
      padding-left:15px;
      text-transform:uppercase;
    }

    .parts-container{
      display:grid;
      gap:20px;
    }

    details{
      background:#111;
      border:1px solid #333;
      border-radius:10px;
      overflow:hidden;
    }

    summary{
      padding:20px;
      font-size:1.2rem;
      cursor:pointer;
      font-weight:bold;
      background:#0f0f0f;
    }

    summary:hover{ color:#d90429; }

    .part-content{
      padding:25px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:25px;
      background:#000;
    }

    @media(max-width:900px){
      .part-content{
        grid-template-columns:1fr;
      }
    }

    .display-box{
      background:#111;
      border:1px solid #333;
      border-radius:12px;
      padding:20px;
    }

    .display-box h4{
      margin:0 0 15px;
      font-size:0.9rem;
      color:#aaa;
      border-bottom:1px solid #d90429;
      padding-bottom:8px;
      text-transform:uppercase;
    }

    model-viewer{
      width:100%;
      height:300px;
      background:#000;
      border-radius:8px;
    }

    .plano-img{
      width:100%;
      height:260px;
      object-fit:contain;
      background:white;
      border-radius:6px;
    }

    .btn-download{
      display:block;
      margin-top:15px;
      text-align:center;
      padding:10px;
      background:#222;
      color:white;
      text-decoration:none;
      border-radius:6px;
      font-weight:bold;
    }

    .btn-download:hover{
      background:#d90429;
    }
  </style>
</head>

<body>

<!-- ===== HERO ===== -->
<header class="hero">
  <video autoplay muted loop playsinline>
    <source src="assets/videoplayback.mp4" type="video/mp4">
  </video>

  <div class="hero-content">
    <h1>Exo<span>Arm</span></h1>
    <p>Proyecto Final – Prótesis Biónica</p>
    <a href="#piezas">Explorar diseño</a>
  </div>
</header>

<!-- ===== PIEZAS ===== -->
<section id="piezas">
  <h2>Piezas del Proyecto</h2>
  <div id="piezas-container" class="parts-container"></div>
</section>

<script src="main.js"></script>
</body>
</html>
